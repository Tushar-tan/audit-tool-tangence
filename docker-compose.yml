version: '3.8'

services:
  audit-platform:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=file:/app/prisma/dev.db
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    volumes:
      - audit-data:/app/public/uploads
      - audit-db:/app/prisma

volumes:
  audit-data:
  audit-db:
